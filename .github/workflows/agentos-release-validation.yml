name: AgentOS Release Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pytest cryptography

      - name: Restore executable launcher bits for validation
        run: |
          chmod +x .agents/bin/agentos .agents/bin/agentos-mcp .agents/bin/hooks/pre-commit
          chmod +x tools/*.py

      - name: Python compile
        run: python -m compileall -q .agents/agentos tools

      - name: Current release validation
        env:
          PYTHONPATH: .agents
        run: |
          python tools/validate_release.py .
          python tools/verify_manifest.py .

      - name: Runtime and documentation checks
        env:
          PYTHONPATH: .agents
        run: |
          .agents/bin/agentos runtime-health
          .agents/bin/agentos docs-check
          .agents/bin/agentos instruction-check

      - name: Full regression suite
        env:
          PYTHONPATH: .agents
        run: python -m pytest -q .agents/tests -rs
